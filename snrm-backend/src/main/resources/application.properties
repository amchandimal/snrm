# ============================================================================
# SNRM backend — environment-independent configuration.
#
# Everything here is true regardless of where the app runs. Anything that names
# a host, a port, a credential or a URL belongs in a profile file:
#   application-local.properties  — local MySQL on localhost:3306 (primary setup)
#   application-prod.properties   — deployed environment (placeholder)
# ============================================================================

spring.application.name=snrm-backend

# Default profile for a plain `mvnw.cmd spring-boot:run`. Overridden by the
# SPRING_PROFILES_ACTIVE environment variable or -Dspring-boot.run.profiles=...
spring.profiles.active=prod

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# Flyway owns the schema. Hibernate only verifies that the mapped
# entities match the migrated tables and fails fast if they have drifted;
# it must never create or alter anything.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Store and read all timestamps in UTC so simulation runs stay reproducible
# across machines and DST boundaries.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------------------
# Flyway — versioned schema
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Migrations are immutable once applied: a changed checksum is a build error,
# not something to repair automatically.
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
# The schema is created by db/bootstrap.sql, not by Flyway.
spring.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------------------
# Authentication — the single research user and the JWT signing key
# ---------------------------------------------------------------------------
# Phase 1 has exactly one account, so there is no user table: the credential
# lives in configuration. Every value is an environment-variable placeholder,
# and no real credential is committed — this file is in version control.
#
# Both secrets are OPTIONAL. Leave them unset and the application generates a
# throwaway credential at startup and prints it to the log, the way Spring Boot
# does for its default user. That makes a fresh clone testable in Swagger
# immediately; it also means the password and every issued token change on
# every restart, so set the variables for anything beyond a first look.
#
#   SNRM_AUTH_USERNAME       login name                     (default: researcher)
#   SNRM_AUTH_PASSWORD_HASH  BCrypt hash of the password, e.g. $2a$10$...
#                            Generate one without starting the app:
#                              mvnw.cmd test -Dtest=BcryptHashToolTest ^
#                                 -Dsnrm.password=your-password -DfailIfNoTests=false
#   SNRM_JWT_SECRET          HMAC-SHA256 signing key, >= 32 characters
#   SNRM_JWT_TTL             token lifetime as an ISO-8601 duration (default: 8h)
snrm.auth.username=${SNRM_AUTH_USERNAME:researcher}
snrm.auth.password-hash=${SNRM_AUTH_PASSWORD_HASH:$2a$10$/Xc1PpX7zUDdvDi.DYTiuucw3.2O0qH7OD1UMPDbEhV1s6CFIehPq}
snrm.auth.jwt-secret=${SNRM_JWT_SECRET:}
snrm.auth.token-ttl=${SNRM_JWT_TTL:PT8H}
snrm.auth.issuer=snrm
# project.owner_id written for rows this user creates. A constant while Phase 1
# has one account; the seam multi-user hardening widens.
snrm.auth.owner-id=1

# ---------------------------------------------------------------------------
# CORS — which browser origins may call this API
# ---------------------------------------------------------------------------
# Only needed when the compiled frontend is served from somewhere other than
# this application. Under `ng serve` the dev server proxies /api here, so the
# browser sees one origin and makes no cross-origin request at all.
#
# Comma-separated, and matched exactly: scheme, host and port, no path and no
# wildcard. https://example.github.io does not admit http://example.github.io.
# Leave it empty and no cross-origin request is answered.
snrm.cors.allowed-origins=${SNRM_CORS_ORIGINS:https://amchandimal.github.io}

# ---------------------------------------------------------------------------
# springdoc-openapi — live REST contract
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ---------------------------------------------------------------------------
# Actuator — health and metrics only; no config/env/beans exposure
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}

# ---------------------------------------------------------------------------
# Jackson — JSON contract for the API
# ---------------------------------------------------------------------------
# ISO-8601 instead of epoch numbers, so exported project bundles stay readable.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null
# Reject unknown fields rather than silently ignoring them — a misspelled
# property in an import or scenario payload is an error worth reporting.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=UTC

# ---------------------------------------------------------------------------
# Multipart — CSV/XLSX network import
# ---------------------------------------------------------------------------
# A whole import arrives in one request: up to five CSV files, or one workbook
# with five sheets. Sized against the 1,000-node networks of FR-04 — a workbook
# that large is a few hundred kilobytes, so 16 MB is generous rather than tight,
# and the ceiling exists to bound what a single request can make the parser hold.
# Files are streamed to disk past the threshold rather than buffered in heap.
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=32MB
spring.servlet.multipart.file-size-threshold=1MB

# ---------------------------------------------------------------------------
# Asynchronous jobs — simulation runs and, in Phase 2, configuration search
# ---------------------------------------------------------------------------
# Bounded on both axes, deliberately. One simulation job already fans out to
# hundreds of replications on virtual threads and saturates the
# machine, so admitting three at once would make all three slower and none of
# them finish sooner. Past the queue, POST /simulations answers 429 rather than
# accepting work it cannot honour — an unbounded queue turns a submission storm
# into an out-of-memory failure an hour later with no request to attribute it to.
#
# Sized for the target deployment: one researcher, one workstation.
# A shared server would want more workers and a shorter queue.
snrm.jobs.workers=2
snrm.jobs.queue-capacity=32
# How many finished jobs stay pollable at GET /jobs/{id}. A courtesy window, not
# a record: the results themselves are durable in simulation_run, so a
# 404 here never means work was lost.
snrm.jobs.retention=200
# Smallest progress change worth publishing. A 200-replication run reporting
# every completion would write the same fields 200 times for a bar that moves in
# whole percent; a changed phase message always publishes regardless.
snrm.jobs.progress-step=0.01

# ---------------------------------------------------------------------------
# Errors — RFC 7807 problem+json
# ---------------------------------------------------------------------------
# Deliberately no spring.mvc.problemdetails.enabled here: Boot's built-in
# handler backs off whenever a ResponseEntityExceptionHandler bean exists, and
# common/GlobalExceptionHandler is one. That class is the single owner of the
# problem+json mapping — setting the property would suggest otherwise.
# Never leak internals through the fallback /error path.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

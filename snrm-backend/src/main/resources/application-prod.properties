# ============================================================================
# Profile 'prod' — PLACEHOLDER. Not yet a supported deployment target.
#
# Activate with: SPRING_PROFILES_ACTIVE=prod (overrides spring.profiles.active
# in application.properties).
#
# Nothing here may carry a literal credential: every secret is supplied by the
# environment at deploy time, with no fallback, so a missing variable fails
# startup loudly instead of silently connecting somewhere unintended.
# ============================================================================

# ---------------------------------------------------------------------------
# Datasource — all four values are required from the environment.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${SNRM_DB_HOST}:${SNRM_DB_PORT:3306}/${SNRM_DB_NAME:snrm}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SNRM_DB_USER}
spring.datasource.password=${SNRM_DB_PASSWORD}
spring.datasource.hikari.pool-name=snrm-prod-pool

# ---------------------------------------------------------------------------
# Hardening relative to 'local'
# ---------------------------------------------------------------------------
server.port=${SNRM_SERVER_PORT:8080}
spring.jpa.show-sql=false
management.endpoint.health.show-details=never
logging.level.com.snrm=INFO

# The OpenAPI UI is a development aid; it is not served in a deployed
# environment (the contract itself stays available to authenticated callers).
springdoc.swagger-ui.enabled=false

